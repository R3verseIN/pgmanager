[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    auth: Authentication and authorization tests
    databases: Database management tests
    users: User management tests
    tables: Table management tests
    data: Data manipulation tests
    sql: SQL execution tests
    audit: Audit logging tests
    backup: Backup and restore tests
    pgbouncer: PgBouncer configuration tests
    ssl: SSL certificate tests
    settings: Settings management tests
    access_control: Managed user access control enforcement tests
    dev_isolation: Dev user database isolation tests
    audit_completeness: Audit log completeness and filtering tests
    auth_management: Auth user management (reset password, update role) tests
    user_management: User CRUD edge case tests
