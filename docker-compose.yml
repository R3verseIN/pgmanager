services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    environment:
      POSTGRES_USER: pgmanager
      POSTGRES_DB: pgmanager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGBOUNCER_AUTH_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD:?PGBOUNCER_AUTH_PASSWORD is required}
      WALG_S3_PREFIX: ${WALG_S3_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_FORCE_PATH_STYLE: ${AWS_S3_FORCE_PATH_STYLE:-false}
      WALG_ARCHIVE_TIMEOUT: ${WALG_ARCHIVE_TIMEOUT:-300}
      WALG_BACKUP_INTERVAL: ${WALG_BACKUP_INTERVAL:-3600}
      WALG_BACKUP_RETENTION_DAYS: ${WALG_BACKUP_RETENTION_DAYS:-7}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - shared-ssh:/root/.shared-ssh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgmanager -d pgmanager"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 15s

  app:
    build:
      context: .
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    ports:
      - "8080:8080"
    environment:
      SECRET_PATH: /var/lib/postgresql/data/pgmanager-password
      PGHOST: db
      PGPORT: "5432"
      PGUSER: pgmanager
      PGDATABASE: pgmanager
      PGBOUNCER_AUTH_PASSWORD: /var/lib/postgresql/data/pgbouncer-auth-password
      SSH_KEY_PATH: /root/.shared-ssh/pgmanager_ed25519
      SSH_USER: root
      SSH_HOST: db
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_FORCE_PATH_STYLE: ${AWS_S3_FORCE_PATH_STYLE:-false}
      WALG_S3_PREFIX: ${WALG_S3_PREFIX:-}
      WALG_ARCHIVE_TIMEOUT: ${WALG_ARCHIVE_TIMEOUT:-300}
      WALG_BACKUP_INTERVAL: ${WALG_BACKUP_INTERVAL:-3600}
      WALG_BACKUP_RETENTION_DAYS: ${WALG_BACKUP_RETENTION_DAYS:-7}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgbouncer_shared:/etc/pgbouncer/shared
      - shared-ssh:/root/.shared-ssh:ro
    depends_on:
      db:
        condition: service_healthy

  pgbouncer:
    build:
      context: .
      dockerfile: Dockerfile.pgbouncer
    ports:
      - "5432:6432"
    volumes:
      - pgdata:/var/lib/postgresql/data:ro
      - pgbouncer_shared:/etc/pgbouncer/shared
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  pgbouncer_shared:
  shared-ssh:
