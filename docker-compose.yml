services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pgmanager
      POSTGRES_PASSWORD: pgmanager
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pgmanager", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://pgmanager:pgmanager@db:5432/postgres?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
