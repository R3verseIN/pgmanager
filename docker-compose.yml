services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    environment:
      POSTGRES_USER: pgmanager
      POSTGRES_DB: pgmanager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGBOUNCER_AUTH_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD:?PGBOUNCER_AUTH_PASSWORD is required}
      PGBACKREST_REPO1_TYPE: ${PGBACKREST_REPO1_TYPE:-s3}
      PGBACKREST_REPO1_S3_BUCKET: ${PGBACKREST_REPO1_S3_BUCKET:-}
      PGBACKREST_REPO1_S3_ENDPOINT: ${PGBACKREST_REPO1_S3_ENDPOINT:-}
      PGBACKREST_REPO1_S3_REGION: ${PGBACKREST_REPO1_S3_REGION:-us-east-1}
      PGBACKREST_REPO1_S3_URI_STYLE: ${PGBACKREST_REPO1_S3_URI_STYLE:-}
      PGBACKREST_REPO1_S3_KEY: ${PGBACKREST_REPO1_S3_KEY:-}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${PGBACKREST_REPO1_S3_KEY_SECRET:-}
      PGBACKREST_REPO1_PATH: ${PGBACKREST_REPO1_PATH:-/backups}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgmanager -d pgmanager"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 15s

  app:
    build:
      context: .
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    ports:
      - "8080:8080"
    environment:
      SECRET_PATH: /var/lib/postgresql/data/pgmanager-password
      PGHOST: db
      PGPORT: "5432"
      PGUSER: pgmanager
      PGDATABASE: pgmanager
      PGBOUNCER_AUTH_PASSWORD: /var/lib/postgresql/data/pgbouncer-auth-password
      PGBACKREST_REPO1_TYPE: ${PGBACKREST_REPO1_TYPE:-s3}
      PGBACKREST_REPO1_S3_BUCKET: ${PGBACKREST_REPO1_S3_BUCKET:-}
      PGBACKREST_REPO1_S3_ENDPOINT: ${PGBACKREST_REPO1_S3_ENDPOINT:-}
      PGBACKREST_REPO1_S3_REGION: ${PGBACKREST_REPO1_S3_REGION:-us-east-1}
      PGBACKREST_REPO1_S3_URI_STYLE: ${PGBACKREST_REPO1_S3_URI_STYLE:-}
      PGBACKREST_REPO1_S3_KEY: ${PGBACKREST_REPO1_S3_KEY:-}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${PGBACKREST_REPO1_S3_KEY_SECRET:-}
      PGBACKREST_REPO1_PATH: ${PGBACKREST_REPO1_PATH:-/backups}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgbouncer_shared:/etc/pgbouncer/shared
    depends_on:
      db:
        condition: service_healthy

  pgbouncer:
    build:
      context: .
      dockerfile: Dockerfile.pgbouncer
    ports:
      - "5432:6432"
    volumes:
      - pgdata:/var/lib/postgresql/data:ro
      - pgbouncer_shared:/etc/pgbouncer/shared
    depends_on:
      db:
        condition: service_healthy

networks:
  default:
    name: pgmanager

volumes:
  pgdata:
  pgbouncer_shared:
