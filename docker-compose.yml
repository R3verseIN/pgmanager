services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_USER: pgmanager
      POSTGRES_DB: pgmanager
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "pgmanager", "-d", "pgmanager" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SECRET_PATH: /var/lib/postgresql/data/pgmanager-password
      PGHOST: db
      PGPORT: "5432"
      PGUSER: pgmanager
      PGDATABASE: pgmanager
      PGSSLMODE: disable
    volumes:
      - pgdata:/var/lib/postgresql/data:ro
      - pgbouncer_shared:/etc/pgbouncer/shared
    depends_on:
      db:
        condition: service_healthy

  pgbouncer:
    build:
      context: .
      dockerfile: Dockerfile.pgbouncer
    ports:
      - "5432:6432"
    environment:
      DATABASE_URL: postgres://pgmanager:__PASSWORD__@db:5432/pgmanager?sslmode=disable
    volumes:
      - pgdata:/var/lib/postgresql/data:ro
      - pgbouncer_shared:/etc/pgbouncer/shared
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  pgbouncer_shared:
