name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run unit tests
        working-directory: backend
        run: go test ./internal/handler/core/ ./internal/handler/testutil/ ./internal/platform/... -v -count=1

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run integration tests
        working-directory: backend
        run: go test -tags integration ./internal/handler/... -v -count=1 -timeout 10m
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run go vet
        working-directory: backend
        run: go vet ./...

      - name: Run go vet integration
        working-directory: backend
        run: go vet -tags integration ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        working-directory: backend
        run: go build ./...

  e2e:
    runs-on: ubuntu-latest
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: docker compose version

      - name: Build and run E2E tests
        run: make test-e2e
