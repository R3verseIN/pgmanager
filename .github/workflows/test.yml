name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run unit tests
        working-directory: backend
        run: go test ./internal/handler/core/ ./internal/handler/testutil/ ./internal/platform/... -v -count=1

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run integration tests
        working-directory: backend
        run: go test -tags integration ./internal/handler/... -v -count=1 -timeout 10m
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run go vet
        working-directory: backend
        run: go vet ./...

      - name: Run go vet integration
        working-directory: backend
        run: go vet -tags integration ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        working-directory: backend
        run: go build ./...

  e2e:
    runs-on: ubuntu-latest
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: docker compose version

      - name: Build and start test stack
        run: docker compose -f docker-compose.test.yml up -d --build

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080/api/auth/setup-check | grep -q "needsSetup"; then
              echo "App is ready"
              break
            fi
            echo "Waiting for app... ($i/30)"
            sleep 2
          done

      - name: Install Python dependencies
        run: pip install -r tests/requirements.txt

      - name: Run E2E tests
        run: pytest tests/ -v --tb=short

      - name: Tear down test stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
