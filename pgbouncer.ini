[databases]
* = host=db port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_user = pgbouncer_auth
auth_query = SELECT * FROM pgbouncer_get_user($1)
auth_hba_file = /etc/pgbouncer/shared/pg_hba.conf
pool_mode = transaction
default_pool_size = 20
max_client_conn = 100
server_reset_query = DISCARD ALL
log_connections = 1
log_disconnections = 1
