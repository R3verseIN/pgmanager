# docker-compose.test.yml — Full WAL-G integration test stack
#
# Spins up MinIO (S3), PostgreSQL with WAL archiving, the pgmanager app,
# PgBouncer, and a socat port bridge for local Go test connectivity.
#
# Usage:
#   ./scripts/test-walg.sh                    # run tests, tear down after
#   ./scripts/test-walg.sh --keep             # run tests, keep stack running
#   docker compose -f docker-compose.test.yml up -d --build  # manual
#
# NEVER use this in production. Test credentials only.

services:
  # ── PostgreSQL with WAL-G ─────────────────────────────────────────
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    environment:
      POSTGRES_USER: pgmanager
      POSTGRES_DB: pgmanager
      POSTGRES_PASSWORD: pgmanager
      PGBOUNCER_AUTH_PASSWORD: pgmanager
      # pgBackRest archiving config (used by Go backend archive setup)
      PGPASSWORD: pgmanager
      PGUSER: pgmanager
      PGDATABASE: pgmanager
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgmanager -d pgmanager"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 20s

  # ── pgmanager app (Go backend + React UI) ─────────────────────────
  app:
    build:
      context: .
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://pgmanager:pgmanager@db:5432/pgmanager?sslmode=disable
      PGHOST: db
      PGPORT: "5432"
      PGUSER: pgmanager
      PGDATABASE: pgmanager
      PGBOUNCER_AUTH_PASSWORD: pgmanager
      PGPASSWORD: pgmanager
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgbouncer_shared:/etc/pgbouncer/shared
    depends_on:
      db:
        condition: service_healthy

  # ── PgBouncer (connection pooler) ─────────────────────────────────
  pgbouncer:
    build:
      context: .
      dockerfile: Dockerfile.pgbouncer
    ports:
      - "5432:6432"
    volumes:
      - pgdata:/var/lib/postgresql/data:ro
      - pgbouncer_shared:/etc/pgbouncer/shared
    depends_on:
      db:
        condition: service_healthy

  # ── socat bridge: exposes db:5432 on host port 5433 ──────────────
  #    Go integration tests connect here for direct DB queries.
  db-test-port:
    image: alpine:3.21
    command: >
      sh -c "apk add --no-cache socat &&
             socat TCP-LISTEN:5432,fork,reuseaddr TCP:db:5432"
    ports:
      - "5433:5432"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  pgbouncer_shared:
