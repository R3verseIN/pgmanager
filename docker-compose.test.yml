services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    environment:
      POSTGRES_USER: pgmanager
      POSTGRES_DB: pgmanager
      POSTGRES_PASSWORD: pgmanager
      PGBOUNCER_AUTH_PASSWORD: pgmanager
      PGPASSWORD: pgmanager
      PGUSER: pgmanager
      PGDATABASE: pgmanager
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgmanager -d pgmanager"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 20s

  app:
    build:
      context: .
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: postgres://pgmanager:pgmanager@db:5432/pgmanager?sslmode=disable
      PGHOST: db
      PGPORT: "5432"
      PGUSER: pgmanager
      PGDATABASE: pgmanager
      PGBOUNCER_AUTH_PASSWORD: pgmanager
      PGPASSWORD: pgmanager
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgbouncer_shared:/etc/pgbouncer/shared
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

  pgbouncer:
    build:
      context: .
      dockerfile: Dockerfile.pgbouncer
    volumes:
      - pgdata:/var/lib/postgresql/data:ro
      - pgbouncer_shared:/etc/pgbouncer/shared
    depends_on:
      db:
        condition: service_healthy

  e2e:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    environment:
      PGMANAGER_URL: http://app:8080
      PG_DSN: postgresql://pgmanager:pgmanager@db:5432/pgmanager?sslmode=disable
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  pgbouncer_shared:
